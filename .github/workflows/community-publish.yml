name: Publish community arena

on:
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Commit that requested publication
        required: true
  push:
    branches: [main]

concurrency:
  group: community-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
          fetch-depth: 0

      - name: Pin source identity
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::publication source must be a full lowercase commit SHA"
            exit 1
          }
          source_sha=$(git rev-parse HEAD)
          [ "$source_sha" = "$REQUESTED_SHA" ] || {
            echo "::error::checkout does not match the requested publication source"
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$source_sha" origin/main || {
            echo "::error::publication source is not an ancestor of main"
            exit 1
          }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          commit_time=$(git show -s --format=%cI HEAD)
          echo "generated_at=$(node -e 'console.log(new Date(process.argv[1]).toISOString())' "$commit_time")" >> "$GITHUB_OUTPUT"

      - name: Begin publication
        id: prepare
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin standings
          git worktree remove ../standings --force 2>/dev/null || true
          git worktree add ../standings origin/standings

          info=$(node .github/scripts/publication-status.mjs inspect ../standings/publication-status.json)
          state=$(jq -r '.state // ""' <<<"$info")
          represented=$(jq -r '.source_sha // ""' <<<"$info")
          last_success=$(jq -r '.last_success_source // ""' <<<"$info")
          if [ "$state" = ready ] && [ "$represented" = "$SOURCE_SHA" ]; then
            echo "source already ready; publication is an idempotent no-op"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$last_success" ]; then
            git merge-base --is-ancestor "$last_success" "$SOURCE_SHA" || {
              echo "::error::queued source is not a descendant of the last successful publication"
              exit 1
            }
          fi

          now=$(node -e 'console.log(new Date().toISOString())')
          node .github/scripts/publication-status.mjs building \
            ../standings/publication-status.json "$SOURCE_SHA" "$now"
          expected_remote=$(git -C ../standings rev-parse HEAD)
          git -C ../standings add publication-status.json
          git -C ../standings commit -m "Mark arena publication building for main@${SOURCE_SHA}"
          git -C ../standings push \
            --force-with-lease="refs/heads/standings:${expected_remote}" origin HEAD:standings
          echo "active=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.prepare.outputs.active == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install and build publisher
        if: steps.prepare.outputs.active == 'true'
        run: |
          echo build_failed > /tmp/publication_failure_code
          npm ci --ignore-scripts
          npm run build

      - name: Replay-verify every community run
        if: steps.prepare.outputs.active == 'true'
        run: |
          echo verify_failed > /tmp/publication_failure_code
          shopt -s nullglob
          dirs=(community/runs/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no community runs found"; exit 1
          fi
          node packages/cli/dist/cli.js verify "${dirs[@]}"

      - name: Build complete artifact set
        if: steps.prepare.outputs.active == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GENERATED_AT: ${{ steps.source.outputs.generated_at }}
        run: |
          echo build_failed > /tmp/publication_failure_code
          mkdir -p out
          node packages/cli/dist/cli.js standings community/runs/*/ \
            --out out/MATCHUPS.md --json-out out/standings.json
          node packages/cli/dist/cli.js public-arena community/runs/*/ \
            --out out/arena --source-sha "$SOURCE_SHA" --generated-at "$GENERATED_AT" \
            --harness-experiments community/harnesslab-experiments.json

      - name: Publish immutable artifacts and ready pointer
        if: steps.prepare.outputs.active == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          echo publish_failed > /tmp/publication_failure_code
          expected_remote=$(git -C ../standings rev-parse HEAD)
          cp out/MATCHUPS.md out/standings.json out/arena/arena.json \
            out/arena/harnesslab.json ../standings/
          rm -rf ../standings/replays
          cp -R out/arena/replays ../standings/replays
          git -C ../standings add -A
          if ! git -C ../standings diff --cached --quiet; then
            git -C ../standings commit -m "Publish arena artifacts from main@${SOURCE_SHA}"
            git -C ../standings push \
              --force-with-lease="refs/heads/standings:${expected_remote}" origin HEAD:standings
          fi
          artifact_commit=$(git -C ../standings rev-parse HEAD)

          published_at=$(node -e 'console.log(new Date().toISOString())')
          node .github/scripts/publication-status.mjs ready \
            ../standings/publication-status.json "$SOURCE_SHA" "$artifact_commit" "$published_at"
          expected_remote="$artifact_commit"
          git -C ../standings add publication-status.json
          git -C ../standings commit -m "Mark arena publication ready for main@${SOURCE_SHA}"
          git -C ../standings push \
            --force-with-lease="refs/heads/standings:${expected_remote}" origin HEAD:standings

      - name: Publish explicit failed state
        if: failure() && steps.prepare.outputs.active == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git -C ../standings fetch origin standings
          git -C ../standings reset --hard origin/standings
          code=$(cat /tmp/publication_failure_code 2>/dev/null || echo publish_failed)
          now=$(node -e 'console.log(new Date().toISOString())')
          node .github/scripts/publication-status.mjs failed \
            ../standings/publication-status.json "$SOURCE_SHA" "$code" "$now"
          expected_remote=$(git -C ../standings rev-parse HEAD)
          git -C ../standings add publication-status.json
          git -C ../standings commit -m "Mark arena publication failed for main@${SOURCE_SHA}"
          git -C ../standings push \
            --force-with-lease="refs/heads/standings:${expected_remote}" origin HEAD:standings

      - name: Remove publication worktree
        if: always()
        run: git worktree remove ../standings --force 2>/dev/null || true
